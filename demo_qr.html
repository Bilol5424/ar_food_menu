<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo QR — AR Food Menu</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;background:#f6f4fb;margin:0;
       min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;padding:32px 40px;border-radius:18px;text-align:center;
        box-shadow:0 8px 30px rgba(0,0,0,.08)}
  h1{color:#6B21A8;font-size:20px;margin:0 0 6px}
  p{color:#555;font-size:13px;margin:4px 0 20px}
  #qr{display:inline-block}
  code{background:#f0ecf7;padding:2px 8px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
  <div class="card">
    <h1>AR Food Menu — Demo QR</h1>
    <p>Откройте приложение → «Сканировать QR» → наведите на этот код</p>
    <div id="qr"></div>
    <p style="margin-top:18px">Содержит: <code>https://armenu.app/r/demo-bistro</code></p>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qr"), {
      text: "https://armenu.app/r/demo-bistro",
      width: 240, height: 240,
      colorDark: "#1a1aa8", colorLight: "#ffffff"
    });
  </script>
</body>
</html>
